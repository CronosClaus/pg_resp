# R-opt — Redis 8.2.8, cache-tuned per bible §10.
#
# Persistence entirely off, and a real cache bound with an LRU policy. This is
# the arm that represents Redis used as what pg_resp is: an ephemeral cache.
# It is also the arm most likely to win on raw throughput, which is the
# expected and published shape (bible §0.5 — publish every number).

save ""
appendonly no

# Matched to pg_resp.max_memory on the measured instance. Equal caps or the
# hit rates are not comparable — see bench/configs/README.md.
maxmemory 256mb
maxmemory-policy allkeys-lru

# io-threads left at its default, per bible §10's "io-threads default".

bind 0.0.0.0
protected-mode no
port 6379
