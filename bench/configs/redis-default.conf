# R-def — Redis 8.2.8, STOCK configuration.
#
# "Stock" means: what an unconfigured `docker run redis` actually does. The
# values below are Redis's own shipped defaults, written out explicitly rather
# than left implicit, so that a reader can verify the claim "this arm is
# untuned" without diffing against an upstream redis.conf.
#
# The one thing that matters here is that RDB snapshotting is ON, at Redis's
# default intervals. Most people never turn it off. R-def is what that costs.

save 3600 1 300 100 60 10000
appendonly no

# No maxmemory: stock Redis has no cache bound at all. This is a real property
# of the untuned arm (and a real operational hazard), not an oversight.
# R-opt is where the cache-shaped configuration lives.

# LOOPBACK ONLY (Phase 4 box requirement 2). --network host puts this server
# in the host's own netns, so this line — not a docker -p mapping — is what
# decides which interfaces it answers on. `ss -tlnp` on the box must show
# nothing on 0.0.0.0/:: except sshd.
bind 127.0.0.1
protected-mode no
port 6379
