# P-def — pg_resp on a STOCK postgresql.conf.
#
# Everything PostgreSQL ships with, plus the single line without which the
# extension cannot exist at all. That line is not "tuning": pg_resp is a
# background worker, and without shared_preload_libraries there is no worker
# and no RESP port (Phase 3 bug 5 — CREATE EXTENSION succeeds without it and
# then nothing works, which is why _PG_init now refuses loudly).
#
# Deliberately NOT set here: shared_buffers, work_mem, max_connections,
# effective_cache_size, wal settings — all left at PostgreSQL's defaults
# (shared_buffers 128MB on a stock install).

shared_preload_libraries = 'pg_resp.so'

# pg_resp GUCs are all left at their compiled defaults:
#   pg_resp.bind_address = 127.0.0.1
#   pg_resp.port         = 6379
#   pg_resp.max_memory   = 256MB      <-- already the default (bible §3.5)
#   pg_resp.eviction     = clock_lru
#   pg_resp.password     = unset
