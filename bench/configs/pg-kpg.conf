# K-pg — the PostgreSQL that Redka runs against, configured DELIBERATELY IN THE
# COMPETITOR'S FAVOUR (Phase 4 amendment A.3.2).
#
# WHY THE COMPETITOR GETS THE BETTER CONFIG
# -----------------------------------------
# G3's structural claim is "pg_resp is >= 5x Redka-on-PG throughput". A 5x gap
# measured against a deliberately hobbled Redka would be worthless. So this arm
# gets the settings a competent operator would actually reach for when running
# Redka on PostgreSQL, including one (synchronous_commit=off) that trades a
# durability guarantee for write throughput:
#
#   - synchronous_commit = off  — Redka's SET path is a real transactional
#     write to a real table. Leaving fsync-per-commit on would make the arm
#     WAL-fsync-bound and the comparison would be measuring disk, not
#     architecture. This is the single largest lever available to it.
#   - shared_buffers = 1GB      — same as P-opt (pg-tuned.conf), so neither side
#     gets a page-cache advantage.
#
# What it deliberately does NOT get: fsync=off or full_page_writes=off. Those
# would make it faster still, but they cross from "tuned" into "would corrupt
# your data", and no one runs a cache that way. The line is the same one
# pg-tuned.conf draws for P-opt.
#
# NOT SET HERE, ON PURPOSE: shared_preload_libraries = 'pg_resp.so'.
# pg_resp must not be loaded while K-pg is the arm under test. It would start a
# background worker and a second RESP listener, burning server cores and
# breaking the one-arm-live-at-a-time rule (ENV.md §8) from inside the arm's own
# process tree — an exclusivity violation that no port probe would catch.

listen_addresses = '127.0.0.1'

shared_buffers = 1GB
effective_cache_size = 4GB

synchronous_commit = off
