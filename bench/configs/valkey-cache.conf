# V-opt — Valkey 8.1.9, tuned identically to R-opt.
#
# The license-clean incumbent, and the one this project treats as its
# behavioural reference for semantics (D8). Configuration is deliberately
# byte-for-byte equivalent in meaning to redis-cache.conf: any Redis/Valkey
# difference in the results should come from the servers, not from the configs.

save ""
appendonly no

maxmemory 256mb
maxmemory-policy allkeys-lru

bind 0.0.0.0
protected-mode no
port 6379
