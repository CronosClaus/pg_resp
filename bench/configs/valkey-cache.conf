# V-opt — Valkey 8.1.9, tuned identically to R-opt.
#
# The license-clean incumbent, and the one this project treats as its
# behavioural reference for semantics (D8). Configuration is deliberately
# byte-for-byte equivalent in meaning to redis-cache.conf: any Redis/Valkey
# difference in the results should come from the servers, not from the configs.

save ""
appendonly no

maxmemory 256mb
maxmemory-policy allkeys-lru

# LOOPBACK ONLY (Phase 4 box requirement 2). --network host puts this server
# in the host's own netns, so this line — not a docker -p mapping — is what
# decides which interfaces it answers on. `ss -tlnp` on the box must show
# nothing on 0.0.0.0/:: except sshd.
bind 127.0.0.1
protected-mode no
port 6379
