# P-opt — pg_resp with the documented tuning from docs/ops.md, and nothing else.
#
# READ THIS BEFORE INTERPRETING THE P-def VS P-opt DELTA
# ------------------------------------------------------
# pg_resp.max_memory already defaults to 256MB, so "max_memory sized" (bible
# §10's description of this arm) is a no-op at the 256MB cap the comparison
# uses for parity with R-opt/V-opt. What is left for this arm to change is
# PostgreSQL-side configuration.
#
# And there is a real possibility — stated up front rather than discovered
# afterwards — that this arm lands within run-to-run noise of P-def. That
# would not be a broken measurement. It would be a direct consequence of the
# architecture: the RESP command path lives in the background worker's own
# heap (D2), serves off a socket the worker owns, and touches no shared
# buffer, no WAL, no planner and no SPI. PostgreSQL tuning has almost nothing
# to act on. If P-def == P-opt within noise, that IS the result, it goes in the
# README as such, and it is worth more than a manufactured difference: it means
# operators do not have to retune their database to adopt the cache.
#
# The converse is also worth measuring and is why this arm exists at all: if
# P-opt is materially FASTER, then something in the RESP path does depend on PG
# configuration, and that dependency needs documenting in ops.md.

shared_preload_libraries = 'pg_resp.so'

# Sized for the benchmark box rather than left at the 128MB stock value. This
# is the one PostgreSQL setting docs/ops.md tells an operator to think about,
# because it is the other tenant competing for RAM with pg_resp.max_memory.
shared_buffers = 1GB
effective_cache_size = 4GB

# The cache is ephemeral by design (D5) and its writes never touch WAL, so no
# WAL, checkpoint or fsync setting is touched here. Turning off fsync would
# make the arm faster and dishonest; "nothing exotic" is a constraint, not a
# suggestion.

# max_memory held at its 256MB default so this arm is comparable to R-opt and
# V-opt, which are capped at 256mb. A larger cache is a different experiment
# and is measured separately in the RAM-per-1M-entries metric, never folded
# into a throughput cell.
pg_resp.max_memory = 256MB
pg_resp.eviction = clock_lru
