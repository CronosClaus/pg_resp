# Valkey differential oracle (bible §5 Phase 1 gate, §9).
# `docker compose run --build runner` from this directory.
services:
  pg_resp:
    build:
      context: ../..
      dockerfile: docker/pg_resp.Dockerfile
    environment:
      POSTGRES_PASSWORD: pg_resp_test
    # Test-only override — see tests/compat/docker-compose.yml's comment:
    # a 127.0.0.1-bound listener is unreachable from sibling containers.
    command: ["postgres", "-c", "pg_resp.bind_address=0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  valkey:
    image: valkey/valkey:8
    # --protected-mode no: without it, Valkey refuses non-loopback
    # connections when no bind/requirepass is configured — would otherwise
    # block the runner container even on this private compose network.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]

  runner:
    image: python:3-slim
    depends_on:
      pg_resp:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - .:/scripts:ro
    working_dir: /scripts
    entrypoint:
      ["python3", "generate_and_compare.py",
       "--candidate-host", "pg_resp", "--candidate-port", "6379",
       "--oracle-host", "valkey", "--oracle-port", "6379",
       "--seed", "42", "--commands", "5000"]
