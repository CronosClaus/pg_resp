# Dockerized 5-client compat matrix (bible §5 Phase 1 gate).
# `docker compose up --build --abort-on-container-exit` from this directory.
services:
  pg_resp:
    build:
      context: ../..
      dockerfile: docker/pg_resp.Dockerfile
    environment:
      POSTGRES_PASSWORD: pg_resp_test
    ports:
      - "6379:6379"
    # Test-only override: pg_resp.bind_address defaults to 127.0.0.1 (bible
    # D6's real security default, unchanged in the image). A loopback-bound
    # listener inside a container's network namespace does not accept
    # traffic arriving via its eth0 interface, so sibling containers on this
    # compose network (redis-py, node-redis, ...) cannot reach it at all —
    # confirmed by hand (connection refused) before adding this override.
    # 0.0.0.0 here is a test-harness necessity, not a deployment
    # recommendation; see docs/ops.md's bind-address warning.
    command: ["postgres", "-c", "pg_resp.bind_address=0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis-cli:
    image: redis:7
    depends_on:
      pg_resp:
        condition: service_healthy
    volumes:
      - ./redis_cli:/scripts:ro
    entrypoint: ["bash", "/scripts/test_t0.sh", "pg_resp", "6379"]

  redis-py:
    image: python:3-slim
    depends_on:
      pg_resp:
        condition: service_healthy
    volumes:
      - ./redis_py:/scripts:ro
    entrypoint: ["sh", "-c", "pip install --quiet redis && python3 /scripts/test_t0.py pg_resp 6379"]

  node-redis:
    image: node:20-slim
    depends_on:
      pg_resp:
        condition: service_healthy
    volumes:
      # Read-only source + a writable working copy: `npm install` needs to
      # write node_modules, which a `:ro` mount can't provide (found by
      # actually running this — the container produced zero output because
      # npm silently failed to write, then `&&` short-circuited node itself).
      - ./node_redis:/scripts:ro
    entrypoint: ["sh", "-c", "cp -r /scripts /work && cd /work && npm install redis && node test_t0.js pg_resp 6379"]

  go-redis:
    image: golang:1.22
    depends_on:
      pg_resp:
        condition: service_healthy
    volumes:
      - ./go_redis:/scripts:ro
    # `go mod download` alone doesn't populate go.sum for a fresh module;
    # needs `go mod tidy` first (found by actually running this).
    entrypoint: ["sh", "-c", "cp -r /scripts /work && cd /work && go mod tidy && go run main.go pg_resp 6379"]

  jedis:
    image: maven:3-eclipse-temurin-21
    depends_on:
      pg_resp:
        condition: service_healthy
    volumes:
      - ./jedis:/scripts:ro
    entrypoint:
      ["sh", "-c", "cp -r /scripts /work && cd /work && \
        mvn -q dependency:get -Dartifact=redis.clients:jedis:5.1.0 && \
        javac -cp $(find /root/.m2 -name 'jedis-5.1.0.jar'):. Test.java && \
        java -cp $(find /root/.m2 -name 'jedis-5.1.0.jar'):. Test pg_resp 6379"]
