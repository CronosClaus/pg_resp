[package]
name = "pg_resp"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
mio = { version = "1.2.2", features = ["net", "os-poll"] }
pgrx = "=0.19.2"
resp-client = { path = "../resp-client" }
resp-proto = { path = "../resp-proto" }
resp-store = { path = "../resp-store" }

[dependencies.pgrx-bench]
version = "=0.19.2"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.2"
